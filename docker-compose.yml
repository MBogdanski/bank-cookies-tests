# Optional wrapper — prefer ./scripts/docker-test.sh (same image and volume name).
services:
  test:
    image: mcr.microsoft.com/playwright/java:v1.63.0-noble
    working_dir: /work
    volumes:
      - .:/work
      - bank-cookies-tests-maven-repo:/root/.m2
    environment:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    command: ["bash", "/work/scripts/docker-test-inner.sh", "test", "-Dbrowser=chromium"]

volumes:
  bank-cookies-tests-maven-repo:
