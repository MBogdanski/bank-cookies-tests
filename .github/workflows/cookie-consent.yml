name: Cookie consent E2E

on:
  push:
  pull_request:

jobs:
  cookie-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run tests in Docker (chromium, firefox, webkit)
        run: bash ./scripts/docker-test-all.sh

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            target/surefire-reports/
            target/screenshots/
