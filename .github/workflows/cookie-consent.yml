name: Cookie consent E2E

on:
  push:
  pull_request:

jobs:
  cookie-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ matrix.browser }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ms-playwright-${{ matrix.browser }}-

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile tests
        run: ./mvnw -B -DskipTests compile test-compile

      - name: Install Playwright OS dependencies
        run: |
          set -euxo pipefail
          echo "Playwright install-deps (${{ matrix.browser }}) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./mvnw -B exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install-deps ${{ matrix.browser }}"

      - name: Install Playwright browsers
        run: |
          set -euxo pipefail
          echo "Playwright install (${{ matrix.browser }}) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./mvnw -B exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install ${{ matrix.browser }}"

      - name: Run cookie consent test
        run: |
          set -euxo pipefail
          echo "Surefire (${{ matrix.browser }}) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./mvnw -B test -Dbrowser=${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.browser }}
          path: |
            target/surefire-reports/
            target/screenshots/
