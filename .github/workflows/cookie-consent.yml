name: Cookie consent E2E

on:
  push:
  pull_request:

jobs:
  cookie-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright/java:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and resolve dependencies
        run: ./mvnw -B install -DskipTests --no-transfer-progress

      - name: Run cookie consent tests
        run: |
          set -euxo pipefail
          echo "Surefire (${{ matrix.browser }}) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ls -la /ms-playwright || true
          ./mvnw -B -Pci test -Dbrowser=${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.browser }}
          if-no-files-found: ignore
          path: |
            target/surefire-reports/
            target/screenshots/
