name: Cookie consent E2E

on:
  push:
  pull_request:

env:
  DEBIAN_FRONTEND: noninteractive
  PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Playwright (${{ matrix.browser }} only)
        timeout-minutes: 10
        run: bash ./scripts/ci-install-browser.sh ${{ matrix.browser }}

      - name: Run tests
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          chmod +x mvnw
          ./mvnw -B test -Dbrowser=${{ matrix.browser }}
        env:
          DEBUG: pw:browser

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.browser }}
          if-no-files-found: ignore
          path: |
            target/surefire-reports/
            target/screenshots/
