name: Cookie consent E2E

on:
  push:
  pull_request:

env:
  DEBIAN_FRONTEND: noninteractive
  # Playwright may warn/fail host validation even when install-deps succeeded (lib version mismatch).
  # See https://github.com/microsoft/playwright/issues/30592
  PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw -B install -DskipTests --no-transfer-progress

      - name: Install Playwright (${{ matrix.browser }} only)
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          ./mvnw -B exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install-deps ${PLAYWRIGHT_BROWSER}"
          ./mvnw -B exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install ${PLAYWRIGHT_BROWSER}"
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}

      - name: Run tests
        run: ./mvnw -B test -Dbrowser=${{ matrix.browser }}

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.browser }}
          if-no-files-found: ignore
          path: |
            target/surefire-reports/
            target/screenshots/
